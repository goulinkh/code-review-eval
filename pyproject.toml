[project]
name = "code-review-eval"
version = "0.1.0"
description = "Code-review fixtures and human adjudication on top of Harbor"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.25.0",
    "jsonschema>=4.23,<5",
    "mlflow>=3.1,<4",
    "pygments>=2.19,<3",
]

[tool.uv]
package = false

[tool.marimo.display]
theme = "dark"

[dependency-groups]
demo = [
    "marimo>=0.25,<0.26",
]
